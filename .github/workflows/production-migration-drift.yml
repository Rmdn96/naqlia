name: Production Migration Drift

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/production-migration-drift.yml"
      - "scripts/supabase/verify-migration-drift.mjs"
      - "supabase/migration-checksums.json"
      - "supabase/migrations/**"
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: production-migration-drift
  cancel-in-progress: false

jobs:
  verify:
    name: Verify repository and production migration history
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify migration history and checksums
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
        run: npm run supabase:migrations:verify

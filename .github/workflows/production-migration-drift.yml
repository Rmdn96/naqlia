name: Production Migration Drift

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: production-migration-drift
  cancel-in-progress: false

jobs:
  verify:
    name: Verify repository and production migration history
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify migration history and checksums
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
        run: npm run supabase:migrations:verify
